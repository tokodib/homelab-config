---
- name: Create Webmin directory
  ansible.builtin.file:
    path: "{{ webmin_directory }}"
    state: directory
    mode: "0755"

- name: Download Webmin repository setup script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/webmin/webmin/master/webmin-setup-repo.sh
    dest: "{{ webmin_directory }}/webmin-setup-repo.sh"
    mode: "0644"

- name: Run Webmin repo
  become: true
  ansible.builtin.command:
    cmd: sh "{{ webmin_directory }}/webmin-setup-repo.sh" --force --stable
    creates: /etc/apt/sources.list.d/webmin-stable.list
  
- name: Install Webmin
  become: true
  ansible.builtin.apt:
    name: webmin
    state: present
    update_cache: true

- name: Ensure webmin is running
  ansible.builtin.service:
    name: webmin
    state: started
    enabled: true

- name: Create Webmin admin user
  become: true
  ansible.builtin.user:
    name: "{{ webmin_admin_user }}"
    password: "{{ vault_webmin_admin_password | password_hash('sha512', vault_webmin_admin_salt) }}"
    groups:
      - sudo
    append: true
    shell: /bin/bash
    create_home: true

