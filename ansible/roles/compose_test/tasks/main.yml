---
- name: Remove native nginx
  ansible.builtin.apt:
    name: nginx
    state: absent

- name: Create Compose application directory
  ansible.builtin.file:
    path: "{{ compose_test_directory }}"
    state: directory
    mode: "0755"

- name: Deploy Compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ compose_test_directory }}/compose.yaml"
    mode: "0644"

- name: Start Compose application
  community.docker.docker_compose_v2:
    project_src: "{{ compose_test_directory }}"
    state: present
