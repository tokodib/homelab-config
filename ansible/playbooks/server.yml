---
- name: My first Ansible playbook
  hosts: homelab
  become: true

  tasks:
#    - name: Show hostname
#      ansible.builtin.command: hostname
      
    - name: Install required packages
      ansible.builtin.apt:
        name: 
          - htop
          - curl
          - nginx
          - btop
          - neofetch
          - mc
        state: present
        update_cache: true

    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Ensure nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Create application directory
      ansible.builtin.file:
        path: /opt/homelab
        state: directory
        owner: automation
        group: automation
        mode: '0755'

    - name: Create application info file
      ansible.builtin.copy:
        dest: /opt/homelab/info.txt
        content: |
          This server is managed by Ansible.
          Host: homelab-server-01
        owner: automation
        group: automation
        mode: '0644'
    
    - name: Create server info file from Template
      ansible.builtin.template:
        src: info2.txt.j2
        dest: /opt/homelab/info2.txt
        owner: automation
        group: automation
        mode: '0644'
        