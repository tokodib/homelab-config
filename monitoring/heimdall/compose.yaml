---
services:
  heimdall:
    image: linuxserver/heimdall:latest
    container_name: heimdall
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
    volumes:
      - /home/user/docker/heimdall:/config
    ports:
      - 80:80
      - 443:443
    restart: unless-stopped

    networks:
      - monitoring

networks:
  monitoring:
    external: true
    name: monitoring    