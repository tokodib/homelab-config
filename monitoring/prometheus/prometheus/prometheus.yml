global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
        - "localhost:9090"

  - job_name: node-exporter
    static_configs:
      - targets: ["192.168.1.225:9100"]  
  
  - job_name: cadvisor
    static_configs:
      - targets: ["192.168.1.225:8080"]

  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]

    static_configs:
      - targets:
        - http://192.168.1.225:3500

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'blackbox-mariadb'
    metrics_path: /probe
    params:
      module: [tcp_connect]

    static_configs:
      - targets:
        - mariadb:3306

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'blackbox-postgresql'
    metrics_path: /probe
    params:
      module: [tcp_connect]

    static_configs:
      - targets:
        - postgresql:5432

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: blackbox-exporter:9115

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

rule_files:
  - 'alert_rules.yml'