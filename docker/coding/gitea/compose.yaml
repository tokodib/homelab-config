services:
  gitea:
    image: docker.gitea.com/gitea:latest
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgresql:5432
      - GITEA__database__NAME=GITEANAME
      - GITEA__database__USER=GITEAUSER
      - GITEA__database__PASSWD=GITEAPASSWD
    restart: always
    networks:
      - database-net
    volumes:
      - ./gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"

networks:
  database-net:
    name: database-net
    external: true

#MANUALLY NEED CREATING : user, password, database
#Login in container: docker exec -it postgresql psql -U postgres
#SQL: CREATE USER gitea WITH PASSWORD 'gitea';
#     CREATE DATABASE gitea OWNER gitea;